name: Publish image (GHCR)

# Builds the bot image for arm64 (Raspberry Pi) and publishes it to this account's GitHub Container Registry.
# The image contains no secrets: configuration is mounted at /app/data when the container runs.
on:
  push:
    branches: [docker-clean]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/qbittorrent-bot-rss

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native arm64 runner, no emulation
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=raw,value={{date 'YYYY-MM-DD'}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
